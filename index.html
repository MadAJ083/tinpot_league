<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The League</title>
<meta name="theme-color" content="#0F4D32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F1; --panel:#FFFFFF; --ink:#18201B; --muted:#5E6A62; --rule:#D5DCD4;
  --green:#0F4D32; --green-2:#1D6B47; --green-soft:#E3EEE6; --red:#C8102E; --red-soft:#FBE7EA;
  --gold:#A87B12; --on-green:#FFFFFF;
  --cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1310; --panel:#151D18; --ink:#E6ECE7; --muted:#95A39A; --rule:#2A352E;
    --green:#1F7A50; --green-2:#2E9464; --green-soft:#17281F; --red:#FF5C6C; --red-soft:#2E161A;
    --gold:#E0B64A; --on-green:#FFFFFF;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1310; --panel:#151D18; --ink:#E6ECE7; --muted:#95A39A; --rule:#2A352E;
  --green:#1F7A50; --green-2:#2E9464; --green-soft:#17281F; --red:#FF5C6C; --red-soft:#2E161A;
  --gold:#E0B64A; --on-green:#FFFFFF;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 110px}

header.top{background:var(--green);color:var(--on-green);padding:18px 16px 16px}
header.top .inner{max-width:640px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
header.top h1{font-family:var(--cond);font-weight:700;font-size:34px;line-height:1;margin:0;letter-spacing:.01em}
header.top .season{font-family:var(--cond);font-size:18px;opacity:.85;font-weight:500}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs .inner{max-width:640px;margin:0 auto;display:flex}
nav.tabs button{flex:1;border:0;background:none;padding:12px 4px 14px;font-family:var(--cond);font-size:17px;font-weight:600;color:var(--muted);border-top:3px solid transparent}
nav.tabs button[aria-current="page"]{color:var(--green-2);border-top-color:var(--green-2)}

h2{font-family:var(--cond);font-weight:700;font-size:26px;margin:26px 0 10px;line-height:1.1}
h3{font-family:var(--cond);font-weight:600;font-size:20px;margin:18px 0 8px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}

.panel{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:14px}
.stack>*+*{margin-top:12px}

/* The honours board: the one loud element */
.board{background:var(--panel);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.board-row{color:inherit;font:inherit;cursor:pointer;display:grid;grid-template-columns:48px 1fr auto;align-items:center;border-bottom:1px solid var(--rule);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;padding:0}
.board-row:last-child{border-bottom:0}
.pos{font-family:var(--cond);font-weight:700;font-size:28px;text-align:center;color:var(--muted);padding:14px 0}
.board-row.first .pos{color:var(--gold)}
.pname{padding:12px 6px}
.pname strong{display:block;font-family:var(--cond);font-size:24px;font-weight:600;line-height:1.1}
.pname span{font-size:13px;color:var(--muted)}
.pts{font-family:var(--cond);font-weight:700;font-size:38px;line-height:1;background:var(--green);color:var(--on-green);min-width:78px;text-align:center;padding:14px 10px;align-self:stretch;display:flex;align-items:center;justify-content:center}
.board-row.first .pts{background:var(--red)}
.board-detail{padding:4px 14px 14px 48px;border-bottom:1px solid var(--rule);font-size:14px}
.board-detail table{width:100%;border-collapse:collapse}
.board-detail td{padding:4px 0;border-bottom:1px dashed var(--rule)}
.board-detail td:last-child{text-align:right;font-family:var(--cond);font-size:17px;font-weight:600}
.dropped td{color:var(--muted);text-decoration:line-through}

.badge{display:inline-block;font-family:var(--cond);font-weight:600;font-size:14px;padding:1px 8px;border-radius:4px;background:var(--green-soft);color:var(--green-2);vertical-align:middle}
.badge.major{background:var(--red-soft);color:var(--red)}
.badge.live{background:var(--red);color:#fff}

.next{display:flex;justify-content:space-between;gap:12px;align-items:center;border-left:5px solid var(--red)}
.next .when{font-family:var(--cond);font-size:22px;font-weight:700;line-height:1.1}

.btn{border:1px solid var(--green-2);background:var(--green-2);color:#fff;border-radius:8px;padding:10px 16px;font-weight:600}
.btn.ghost{background:none;color:var(--green-2)}
.btn.danger{background:none;border-color:var(--red);color:var(--red)}
.btn.big{width:100%;padding:15px;font-size:18px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}

label.field{display:block;margin-bottom:12px}
label.field>span{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=number],input[type=date],select{width:100%;padding:10px;border:1px solid var(--rule);border-radius:8px;background:var(--bg)}
input.tiny{width:64px;padding:8px;text-align:center}
.check{display:flex;gap:10px;align-items:center;padding:6px 0}
.check input{width:20px;height:20px}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.grid{border-collapse:collapse;font-size:14px;min-width:100%}
table.grid th,table.grid td{border:1px solid var(--rule);padding:6px 5px;text-align:center}
table.grid th{font-family:var(--cond);font-weight:600;font-size:15px;background:var(--green-soft)}
table.grid td.name{text-align:left;white-space:nowrap;font-weight:600}
table.grid td.tot{font-family:var(--cond);font-weight:700;font-size:16px}

/* Scorecard */
.holes{display:flex;gap:6px;padding:4px 0 8px}
.holes button{flex:0 0 36px;height:36px;border-radius:50%;border:1px solid var(--rule);background:var(--panel);font-family:var(--cond);font-weight:600;font-size:16px}
.holes button.done{background:var(--green-soft);border-color:var(--green-2)}
.holes button.cur{background:var(--green-2);color:#fff;border-color:var(--green-2)}
.hole-head{display:flex;align-items:baseline;justify-content:space-between;margin:10px 0}
.hole-head .no{font-family:var(--cond);font-weight:700;font-size:44px;line-height:1}
.hole-head .meta{font-family:var(--cond);font-size:22px;font-weight:600;text-align:right}
.player{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.player .who strong{font-family:var(--cond);font-size:22px;font-weight:600}
.player .who .dots{color:var(--red);letter-spacing:2px;font-size:14px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:48px;height:48px;border-radius:10px;border:1px solid var(--rule);background:var(--bg);font-size:26px;font-weight:600;line-height:1}
.stepper .val{min-width:48px;text-align:center;font-family:var(--cond);font-weight:700;font-size:38px}
.player .foot{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
.hp{font-family:var(--cond);font-weight:700;font-size:20px;color:var(--ink);background:var(--green-soft);border-radius:6px;padding:0 8px}
.hp.zero{background:var(--red-soft);color:var(--red)}
.pick{border:1px dashed var(--rule);background:none;border-radius:6px;padding:4px 10px;font-size:13px}
.pick.on{border-style:solid;border-color:var(--red);color:var(--red)}
.navrow{display:flex;gap:10px;margin-top:14px}
.navrow .btn{flex:1}

.result{width:100%;border-collapse:collapse;margin-top:8px}
.result td{padding:5px 0;border-top:1px solid var(--rule)}
.result td.n{text-align:right;font-family:var(--cond);font-size:18px;font-weight:600;width:70px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:20;max-width:90%;font-size:15px}
.empty{text-align:center;padding:30px 10px}
@media (prefers-reduced-motion: no-preference){ .toast{animation:up .2s ease-out} @keyframes up{from{opacity:0;transform:translate(-50%,8px)}} }
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
/* ================= YOUR SETTINGS =================
   1. Paste the config from Firebase: Project settings > Your apps > Web app
   Your organiser UID lives only in the Firestore rules, never in this file. */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAgSQ-iKAxv1RTe3LPhgaBV-8p99-FmV9Y",
  authDomain: "the-tinpot-league.firebaseapp.com",
  projectId: "the-tinpot-league",
  storageBucket: "the-tinpot-league.firebasestorage.app",
  messagingSenderId: "173832523185",
  appId: "1:173832523185:web:494e82c2a79e5679868190"
};
/* ================================================= */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, collection, onSnapshot, setDoc, updateDoc, deleteDoc, serverTimestamp, getDocFromServer }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signInAnonymously, signInWithPopup, signInWithRedirect, GoogleAuthProvider, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
/* ---------- constants ---------- */
const TYPES = { standard:{label:"Standard", mult:1}, major:{label:"Major", mult:2}, final:{label:"The Final", mult:2} };
const POINTS3 = [5,3,1];

/* ---------- state ---------- */
const S = {
  db:null, user:null, ready:false, noDb:false,
  isOwner:false, canWrite:true,
  settings:null, courses:{}, rounds:{}, cards:{},
  tab:"table", openPlayer:null,
  cardRound:null, hole:1, fullCard:false,
  draftLeague:null, editCourse:null, editRound:null,
  local:{}, phase:"loading", unsubs:[], fs:null, auth:null, uid:null, pinBusy:false
};

/* ---------- tiny DOM helper (textContent only) ---------- */
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  if (props) for (const [k,v] of Object.entries(props)){
    if (v==null || v===false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k==="class") el.className = v;
    else if (k==="value") el.value = v;
    else if (k==="checked") el.checked = !!v;
    else if (k==="selected") el.selected = !!v;
    else if (v===true) el.setAttribute(k,"");
    else el.setAttribute(k, v);
  }
  for (const k of kids.flat(Infinity)){
    if (k==null || k===false) continue;
    el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  }
  return el;
}
function toast(msg){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t = h("div",{class:"toast",role:"status"},msg);
  document.body.append(t); setTimeout(()=>t.remove(), 2800);
}
const uid = p => p + Math.random().toString(36).slice(2,9);
const today = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const fmtDate = s => { if(!s) return ""; const d=new Date(s+"T12:00:00"); return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}); };
const fmtIndex = n => n==null||isNaN(n) ? "" : (n<0 ? "+"+Math.abs(n) : String(n));
const parseIndex = s => { s=String(s).trim(); if(!s) return NaN; return s.startsWith("+") ? -parseFloat(s.slice(1)) : parseFloat(s); };
const fmtPts = n => Number.isInteger(n) ? String(n) : n.toFixed(1);

/* ---------- golf maths ---------- */
function courseHandicap(index, tee, course){
  const par = course.par.reduce((a,b)=>a+b,0);
  return Math.round(index * tee.slope / 113 + (tee.cr - par));
}
function playingHandicap(ch, allowance, adj){ return Math.round(ch * allowance / 100) + (adj||0); }
function shotsOn(ph, si){
  if (ph >= 0) return Math.floor(ph/18) + (si <= ph%18 ? 1 : 0);
  const g = -ph; return -(Math.floor(g/18) + (si > 18 - (g%18) ? 1 : 0));
}
function holePoints(strokes, par, shots){
  if (strokes==null || strokes==="P") return 0;
  return Math.max(0, par + shots - strokes + 2);
}
const playerById = id => (S.settings?.players||[]).find(p=>p.id===id);
const pname = id => playerById(id)?.name || "Former player";
const cardId = (rid,pid) => rid + "__" + pid;
function strokesFor(rid,pid){
  const id = cardId(rid,pid);
  if (S.local[id]) return S.local[id];
  const c = S.cards[id]; return c?.strokes || Array(18).fill(null);
}
function cardFor(rid,pid){ return S.cards[cardId(rid,pid)]; }
function stableford(round, pid){
  const course = S.courses[round.courseId]; if(!course) return 0;
  const ph = round.hcp?.[pid]?.ph ?? 0; const st = strokesFor(round.id,pid);
  let t=0; for(let i=0;i<18;i++) t += holePoints(st[i], course.par[i], shotsOn(ph, course.si[i]));
  return t;
}
function thru(round,pid){ return strokesFor(round.id,pid).filter(x=>x!=null).length; }
function roundStatus(r){
  const cs = r.players.map(p=>cardFor(r.id,p));
  if (r.players.length && cs.every(c=>c?.submitted)) return "complete";
  if (r.players.some(p=>thru(r,p)>0)) return "live";
  return "scheduled";
}
function roundResults(r){
  const rows = r.players.map(pid=>({pid, score:stableford(r,pid)})).sort((a,b)=>b.score-a.score);
  const table = POINTS3;
  const mult = TYPES[r.type]?.mult || 1;
  let i=0;
  while (i<rows.length){
    let j=i; while (j+1<rows.length && rows[j+1].score===rows[i].score) j++;
    let sum=0; for(let k=i;k<=j;k++) sum += table[k]||0;
    for(let k=i;k<=j;k++){ rows[k].pos=i+1; rows[k].pts = (sum/(j-i+1))*mult; }
    i=j+1;
  }
  return rows;
}
const seasonRounds = () => Object.values(S.rounds).filter(r=>r.season===S.settings?.season);
function leaderboard(){
  const players = S.settings?.players||[]; const bestOf = +S.settings?.bestOf || 0;
  const done = seasonRounds().filter(r=>roundStatus(r)==="complete").sort((a,b)=>a.date<b.date?-1:1);
  const byP = {}; players.forEach(p=>byP[p.id]={pid:p.id, entries:[], total:0, wins:0, best:null});
  for (const r of done){
    for (const row of roundResults(r)){
      const b = byP[row.pid]; if(!b) continue;
      b.entries.push({r, pts:row.pts, score:row.score, pos:row.pos, n:r.players.length});
      if (row.pos===1) b.wins++;
      if (b.best==null || row.score>b.best) b.best=row.score;
    }
  }
  for (const b of Object.values(byP)){
    const ranked = [...b.entries].sort((a,c)=>c.pts-a.pts || (a.r.date<c.r.date?-1:1));
    const counted = new Set((bestOf>0 ? ranked.slice(0,bestOf) : ranked).map(e=>e.r.id));
    b.entries.forEach(e=>e.counted=counted.has(e.r.id));
    b.total = b.entries.filter(e=>e.counted).reduce((a,e)=>a+e.pts,0);
  }
  return Object.values(byP).sort((a,b)=>b.total-a.total || b.wins-a.wins || (b.best??-1)-(a.best??-1));
}
function suggestedAdj(forType, date, excludeId){
  if (!S.settings?.adjust || forType!=="standard") return {};
  const prev = seasonRounds().filter(r=>r.id!==excludeId && r.date<=date && r.players.length>=3 && roundStatus(r)==="complete")
    .sort((a,b)=>a.date<b.date?1:-1)[0];
  if (!prev) return {};
  const res = roundResults(prev), out={};
  if (res[0].score !== res[1]?.score) out[res[0].pid] = -1;
  const last = res[res.length-1]; if (last.score !== res[res.length-2]?.score) out[last.pid] = 1;
  return out;
}

/* ---------- writes ---------- */
async function guarded(fn, okMsg){
  try { await fn(); if(okMsg) toast(okMsg); return true; }
  catch(e){
    if (e?.code==="permission-denied") toast("You don't have permission to change this");
    else toast("Couldn't save ("+(e?.code||"error")+"). Try again");
    return false;
  }
}
function writeCard(rid,pid,strokes,submitted){
  return S.db.doc("cards/"+cardId(rid,pid)).set({roundId:rid, playerId:pid, strokes, submitted});
}
function setStroke(rid,pid,hole,val){
  const id = cardId(rid,pid);
  const st = [...strokesFor(rid,pid)]; st[hole-1]=val; S.local[id]=st;
  // Not awaited: Firestore applies it locally at once and syncs when there's signal
  writeCard(rid,pid,st,!!S.cards[id]?.submitted).catch(e=>{
    delete S.local[id];
    toast(e?.code==="permission-denied" ? "That card is locked. Ask the organiser to reopen the round" : "Couldn't save that score");
    render();
  });
  render();
}
function submitRound(r){
  const bad = r.players.filter(p=>thru(r,p)<18);
  if (bad.length){ toast("Every hole needs a score or a pick up first"); return; }
  const writes = r.players.map(p=>writeCard(r.id,p,strokesFor(r.id,p),true));
  Promise.all(writes).catch(e=>toast(e?.code==="permission-denied" ? "Submit was refused. Check the round with the organiser" : "Submit failed. Try again"));
  toast(navigator.onLine ? "Scores submitted. The table is updated" : "Submitted. It'll sync when you've got signal");
  S.tab="table"; render();
}
async function reopenRound(r){
  if (!confirm("Reopen this round so scores can be changed?")) return;
  await guarded(async()=>{ for(const p of r.players){ if(cardFor(r.id,p)) await S.db.doc("cards/"+cardId(r.id,p)).update({submitted:false}); } }, "Round reopened");
}
async function deleteRound(r){
  if (!confirm("Delete this round and any scores in it?")) return;
  await guarded(async()=>{
    for(const p of r.players){ if(cardFor(r.id,p)) await S.db.doc("cards/"+cardId(r.id,p)).delete(); }
    await S.db.doc("admin/cfg/rounds/"+r.id).delete();
  }, "Round deleted");
}
async function setLeaguePin(pin){
  pin = pin.trim();
  if (pin.length < 6) return toast("Use at least 6 characters. Longer is harder to guess");
  if (await guarded(()=>S.db.doc("secret/pin").set({value:pin}), "League PIN saved. Send it to your mates")) render();
}
/* ---------- views ---------- */
function roundLabel(r){
  const c = S.courses[r.courseId]; const tee = c?.tees.find(t=>t.id===r.teeId);
  return (c?.name||"Unknown course") + (tee ? ", "+tee.name+" tees" : "");
}
function typeBadge(r){ return r.type==="standard" ? null : h("span",{class:"badge major"}, TYPES[r.type].label+" x2"); }

function viewTable(){
  const out = [];
  const up = seasonRounds().filter(r=>roundStatus(r)!=="complete").sort((a,b)=>a.date<b.date?-1:1);
  const live = up.find(r=>roundStatus(r)==="live");
  const next = live || up.find(r=>r.date>=today()) || up[0];
  if (next){
    const isLive = roundStatus(next)==="live";
    out.push(h("div",{class:"panel next", style:"margin-top:18px"},
      h("div",null,
        h("div",{class:"small muted"}, isLive ? "In play now" : "Next round"),
        h("div",{class:"when"}, fmtDate(next.date)),
        h("div",null, roundLabel(next), " ", typeBadge(next))),
      h("button",{class:"btn", onclick:()=>{S.cardRound=next.id; S.hole=firstOpenHole(next); S.tab="card"; render();}}, isLive?"Live card":"Scorecard")));
  }
  out.push(h("h2",null,"League table"));
  const lb = leaderboard();
  if (!lb.length) return [...out, h("div",{class:"panel empty muted"},"No players yet.")];
  const board = h("div",{class:"board"});
  let prevTotal=null, prevPos=0;
  lb.forEach((b,i)=>{
    const pos = (prevTotal===b.total) ? prevPos : i+1; prevTotal=b.total; prevPos=pos;
    const counted = b.entries.filter(e=>e.counted).length;
    const open = S.openPlayer===b.pid;
    board.append(h("button",{class:"board-row"+(pos===1&&b.total>0?" first":""), "aria-expanded":String(open),
      onclick:()=>{S.openPlayer=open?null:b.pid; render();}},
      h("div",{class:"pos"}, b.total>0||b.entries.length? pos : "–"),
      h("div",{class:"pname"}, h("strong",null,pname(b.pid)),
        h("span",null, b.entries.length ? `${b.entries.length} played, ${counted} counting, ${b.wins} win${b.wins===1?"":"s"}, best ${b.best} pts` : "Yet to play")),
      h("div",{class:"pts"}, fmtPts(b.total))));
    if (open && b.entries.length){
      board.append(h("div",{class:"board-detail"}, h("table",null,
        [...b.entries].reverse().map(e=>h("tr",{class:e.counted?"":"dropped"},
          h("td",null, fmtDate(e.r.date)+", "+(S.courses[e.r.courseId]?.name||"")+(e.r.type!=="standard"?" ("+TYPES[e.r.type].label+")":"")),

function firstOpenHole(r){

async function saveCourse(){
  const c = S.editCourse;
  if (!c.name.trim()) return toast("Give the course a name");
  if (c.par.some(p=>!(p>=3&&p<=6))) return toast("Each par should be between 3 and 6");
  const si = c.si.map(Number); const set = new Set(si);
  if (si.some(x=>!(x>=1&&x<=18)) || set.size!==18) return toast("Stroke indexes must use each number from 1 to 18 once");
  const tees = [];
  for (const t of c.tees){
    const cr=parseFloat(t.cr), sl=parseInt(t.slope,10);
    if (!t.name.trim() || isNaN(cr) || !(sl>=55&&sl<=155)) return toast("Each tee needs a name, a rating like 70.4 and a slope between 55 and 155");
    tees.push({id:t.id, name:t.name.trim(), cr, slope:sl});
  }
  const clean = {id:c.id, name:c.name.trim(), par:c.par.map(Number), si, tees};

  }
  const clean = {id:d.id, date:d.date, courseId:d.courseId, teeId:d.teeId, type:d.type, players:d.players, hcp, season:d.season||S.settings.season};
  if (await guarded(()=>S.db.doc("admin/cfg/rounds/"+d.id).set(clean), "Round saved. Everyone can see it now")){ S.editRound=null; S.tab="rounds"; render(); }
}

/* ---------- PIN, sign in, shell ---------- */
function pinSection(){
  let v="";
  return [h("h2",null,"League PIN"),
    h("div",{class:"panel"},
      h("p",{class:"small muted"},"Your mates enter this once on each phone. Changing it locks everyone out until they enter the new one."),
      h("div",{class:"row", style:"flex-wrap:nowrap"},
        h("input",{type:"text", autocomplete:"off", "aria-label":"New league PIN", placeholder:"New PIN", oninput:e=>v=e.target.value}),
        h("button",{class:"btn", onclick:()=>setLeaguePin(v)},"Set PIN"))),
    h("button",{class:"btn ghost", style:"margin-top:14px", onclick:()=>signOut(S.auth)},"Sign out of organiser account")];
}
function viewPin(){
  let v="";
  const go = async()=>{
    const pin=v.trim(); if(!pin) return;
    S.pinBusy=true; render();
    try { await setDoc(doc(S.fs,"members/"+S.uid), {pin, at:serverTimestamp()}); S.pinBusy=false; subscribe(); }
    catch(e){ S.pinBusy=false; render(); toast(e?.code==="permission-denied" ? "That PIN isn't right" : "Couldn't check the PIN. Check your signal"); }
  };
  return [h("div",{class:"panel", style:"margin-top:24px"},
    h("h2",{style:"margin-top:0"},"Enter the league PIN"),
    h("p",{class:"muted"},"You only need to do this once on this phone."),
    h("input",{type:"text", autocomplete:"off", autocapitalize:"off", "aria-label":"League PIN", placeholder:"PIN",
      oninput:e=>v=e.target.value, onkeydown:e=>{ if(e.key==="Enter") go(); }}),
    h("button",{class:"btn big", style:"margin-top:12px", disabled:S.pinBusy, onclick:go}, S.pinBusy?"Checking…":"Join the league")),
    h("p",{style:"margin-top:18px;text-align:center"}, h("button",{class:"btn ghost", onclick:organiserSignIn},"Organiser sign in"))];
}
async function organiserSignIn(){
  const p = new GoogleAuthProvider();
  try { await signInWithPopup(S.auth, p); }
  catch(e){ if (e?.code==="auth/popup-blocked" || e?.code==="auth/operation-not-supported-in-this-environment") signInWithRedirect(S.auth, p); else if (e?.code!=="auth/popup-closed-by-user") toast("Sign in failed ("+e.code+")"); }
}
function viewNotAdmin(){
  return [h("div",{class:"panel", style:"margin-top:24px"},
    h("h2",{style:"margin-top:0"},"This Google account isn't the organiser"),
    h("p",null,"If you're setting the league up, this is your UID. Paste it into firestore.rules, publish the rules in the Firebase console, then reload this page."),
    h("input",{type:"text", readonly:true, value:S.uid, "aria-label":"Your UID", onfocus:e=>e.target.select()}),
    h("button",{class:"btn ghost", style:"margin-top:12px", onclick:()=>signOut(S.auth)},"Sign out"))];
}

function render(){
  const app = document.getElementById("app");
  const header = h("header",{class:"top"}, h("div",{class:"inner"},
    h("h1",null,"The League"), h("div",{class:"season"}, S.settings?.season || "")));
  const main = h("main",{class:"wrap"});
  const bare = (...kids)=>{ main.append(...kids); app.replaceChildren(header, main); };
  if (S.phase==="config") return bare(h("div",{class:"panel", style:"margin-top:24px"}, h("h2",{style:"margin-top:0"},"Almost there"), h("p",null,"Paste your Firebase config into FIREBASE_CONFIG at the top of index.html.")));
  if (S.phase==="pin") return bare(...viewPin());
  if (S.phase==="notadmin") return bare(...viewNotAdmin());
  if (!S.ready) return bare(h("p",{class:"muted", style:"margin-top:24px"},"Loading the league…"));

  if (!S.settings && !S.isOwner){
    main.append(h("div",{class:"panel empty", style:"margin-top:24px"},"The league hasn't been set up yet."));
  } else if (!S.settings && S.isOwner && S.tab!=="setup"){
    main.append(h("div",{class:"panel", style:"margin-top:24px"}, h("h2",{style:"margin-top:0"},"Set up your league"),
      h("p",null,"Set a league PIN, add your players and handicaps, then a course, then your first round."),
      h("button",{class:"btn", onclick:()=>{S.tab="setup"; render();}},"Start setup")));
  } else {
    const v = {table:viewTable, rounds:viewRounds, card:viewCard, setup:viewSetup}[S.tab]();
    main.append(...v);
    if (S.tab==="setup" && !S.editCourse && !S.editRound) main.append(...pinSection());
  }
  const tabs = [["table","Table"],["rounds","Rounds"],["card","Scorecard"]];
  if (S.isOwner) tabs.push(["setup","Setup"]);
  const nav = h("nav",{class:"tabs", "aria-label":"Sections"}, h("div",{class:"inner"},
    tabs.map(([k,l])=>h("button",{"aria-current":S.tab===k?"page":null, onclick:()=>{
      if (k==="card" && S.tab!=="card"){ S.cardRound = S.cardRound && S.rounds[S.cardRound] && roundStatus(S.rounds[S.cardRound])!=="complete" ? S.cardRound : null; S.fullCard=false; }
      if (k!=="setup"){ S.editCourse=null; S.editRound=null; }
      S.tab=k; render(); window.scrollTo(0,0); }}, l))));
  app.replaceChildren(header, main, nav);
}
function snapRender(){
  const a = document.activeElement;
  if (a && /^(INPUT|SELECT)$/.test(a.tagName)){ S.pendingRender=true; return; }
  render();
}
document.addEventListener("focusout", ()=>setTimeout(()=>{
  const a=document.activeElement;
  if (S.pendingRender && !(a && /^(INPUT|SELECT)$/.test(a.tagName))){ S.pendingRender=false; render(); }
},50));

function teardown(){ (S.unsubs||[]).forEach(u=>u()); S.unsubs=[]; S.ready=false; }
function subscribe(){
  teardown(); S.phase="ready"; render();
  let loaded=0; const mark=()=>{ if(++loaded>=4 && !S.ready){ S.ready=true; render(); } };
  const onErr = e=>{
    if (e?.code==="permission-denied"){ teardown(); S.phase = S.isOwner ? "ready" : "pin"; render(); if(!S.isOwner) toast("Enter the league PIN to continue"); }
    else toast("Lost connection to the league. Reload to reconnect");
  };
  const fs=S.fs;
  S.unsubs.push(onSnapshot(doc(fs,"admin/cfg"), s=>{ S.settings = s.exists() ? s.data() : null; mark(); snapRender(); }, onErr));
  S.unsubs.push(onSnapshot(collection(fs,"admin/cfg/courses"), q=>{ const o={}; q.docs.forEach(d=>o[d.id]={...d.data(), id:d.id}); S.courses=o; mark(); snapRender(); }, onErr));
  S.unsubs.push(onSnapshot(collection(fs,"admin/cfg/rounds"), q=>{ const o={}; q.docs.forEach(d=>o[d.id]={...d.data(), id:d.id}); S.rounds=o; mark(); snapRender(); }, onErr));
  S.unsubs.push(onSnapshot(collection(fs,"cards"), q=>{
    const o={}; q.docs.forEach(d=>o[d.id]=d.data()); S.cards=o;
    for (const id of Object.keys(S.local)) if (JSON.stringify(o[id]?.strokes)===JSON.stringify(S.local[id])) delete S.local[id];
    mark(); snapRender();
  }, onErr));
}

function boot(){
  if (!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.startsWith("PASTE")){ S.phase="config"; render(); return; }
  const app = initializeApp(FIREBASE_CONFIG);
  S.fs = initializeFirestore(app, {localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()})});
  S.auth = getAuth(app);
  const fs = S.fs;
  S.db = { doc: p => ({ set: d=>setDoc(doc(fs,p),d), update: d=>updateDoc(doc(fs,p),d), delete: ()=>deleteDoc(doc(fs,p)) }) };
  render();
  onAuthStateChanged(S.auth, async u=>{
    teardown();
    if (!u){ signInAnonymously(S.auth).catch(e=>toast("Couldn't connect ("+e.code+")")); return; }
    S.uid = u.uid; S.isOwner = false;
    if (!u.isAnonymous){
      // Organiser check happens on Google's side: only the UID in the rules can read this
      try { await getDocFromServer(doc(S.fs,"adminCheck/me")); S.isOwner = true; }
      catch(e){
        if (e?.code!=="permission-denied") toast("Couldn't check organiser access. Check your connection and reload");
        S.phase="notadmin"; render(); return;
      }
    }
    if (!S.isOwner && S.tab==="setup") S.tab="table";
    subscribe();
  });
}
boot();
</script>
</body>
</html>
