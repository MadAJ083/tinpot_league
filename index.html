<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tinpot Tour</title>
<meta name="theme-color" content="#0A1F44">
<script>/* Apply a saved Light/Dark choice before first paint so the page doesn't flash */try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800;1,900&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F6; --panel:#FFFFFF; --ink:#0E1726; --muted:#56627A; --rule:#D5DBE5; --steel:#E2E7EF;
  --navy:#0A1F44; --navy-ink:#0A1F44; --on-navy:#FFFFFF; --sub-navy:#B9C6DD; --navy-line:#2C4A82;
  --red:#D0202E; --red-ink:#D0202E; --red-soft:#FBE4E6; --av-bg:#C9D3E3; --av-fg:#8394B3;
  --narrow:"Archivo Narrow","Arial Narrow",Arial,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  color-scheme:light dark;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1120; --panel:#121B2D; --ink:#E7ECF4; --muted:#9AA6BC; --rule:#24304A; --steel:#1A2540;
    --navy:#0A1F44; --navy-ink:#C9D6EE; --on-navy:#FFFFFF; --sub-navy:#B9C6DD; --navy-line:#2C4A82;
    --red:#D0202E; --red-ink:#FF7A84; --red-soft:#3A1A20; --av-bg:#2A3956; --av-fg:#6F82A6;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1120; --panel:#121B2D; --ink:#E7ECF4; --muted:#9AA6BC; --rule:#24304A; --steel:#1A2540;
  --navy:#0A1F44; --navy-ink:#C9D6EE; --on-navy:#FFFFFF; --sub-navy:#B9C6DD; --navy-line:#2C4A82;
  --red:#D0202E; --red-ink:#FF7A84; --red-soft:#3A1A20; --av-bg:#2A3956; --av-fg:#6F82A6;
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 110px}

header.top{background:var(--navy);color:var(--on-navy);padding:14px 16px;border-bottom:4px solid var(--red)}
header.top .inner{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-style:italic;font-size:21px;letter-spacing:.02em}
header.top .season{font-family:var(--narrow);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;border:1px solid #5872A3;border-radius:4px;padding:3px 8px;white-space:nowrap}
.hdr-right{display:flex;align-items:center;gap:8px}
.theme-btn{width:44px;height:44px;flex-shrink:0;border:1px solid #5872A3;border-radius:6px;background:none;color:#fff;display:inline-flex;align-items:center;justify-content:center}
@media (max-width:380px){ .brand{font-size:18px} header.top .season{letter-spacing:.04em} }

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs .inner{max-width:640px;margin:0 auto;display:flex}
nav.tabs button{flex:1;min-width:0;border:0;background:none;min-height:56px;padding:0 2px;font-family:var(--narrow);font-size:14px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);border-top:3px solid transparent}
nav.tabs button[aria-current="page"]{color:var(--navy-ink);font-weight:800;border-top-color:var(--red)}

.pagehead{margin:20px 0 12px}
.pagehead h2{margin:0}
h2{font-weight:800;font-size:24px;margin:24px 0 10px;line-height:1.1;text-transform:uppercase}
h3{font-weight:700;font-size:18px;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.02em}
.sub,.eyebrow{font-family:var(--narrow);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.sub{color:var(--muted)}
.eyebrow{display:flex;align-items:center;gap:6px}
.eyebrow.red{color:var(--red-ink)}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-family:var(--narrow);font-weight:700}
.title-it{font-weight:800;font-style:italic;text-transform:uppercase;line-height:1.1}

.panel{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:14px}
.stack>*+*{margin-top:12px}

/* Players: placeholder mugshot, flag, name */
.who{display:flex;align-items:center;gap:9px;min-width:0}
.who strong{font-weight:700;text-transform:uppercase;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{flex-shrink:0;border-radius:50%;background:var(--av-bg);color:var(--av-fg);overflow:hidden;display:inline-flex;align-items:flex-end;justify-content:center}
.av.sq{border-radius:8px;border-bottom:3px solid var(--red)}
.flag{flex-shrink:0;display:block}

/* Cup leader */
.leader{background:var(--panel);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.leader .top{display:flex;gap:14px;align-items:center;padding:12px 16px}
.leader .name{font-size:24px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--rule)}
.stats>div{padding:8px 16px;display:flex;flex-direction:column;border-right:1px solid var(--rule)}
.stats>div:last-child{border-right:0}
.stats .num{font-size:26px;line-height:1;color:var(--navy-ink)}
.stats span:last-child{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted)}

/* Next tournament */
.next{background:var(--panel);border:1px solid var(--rule);border-radius:8px;overflow:hidden;margin-top:12px}
.next .strip{background:var(--navy);color:var(--on-navy);padding:7px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.next .body{padding:10px 16px 12px}
.next .when{font-size:19px}

.champ-banner{display:flex;align-items:center;gap:12px;width:100%;margin-bottom:12px;padding:12px 16px;border:0;border-radius:8px;background:var(--navy);color:var(--on-navy);text-align:left}
.champ-banner>span{flex:1;display:flex;flex-direction:column}
.champ-banner strong{text-transform:uppercase;font-style:italic;font-weight:900}
.champ-banner span span{font-size:14px;color:var(--sub-navy)}

/* Standings table */
.board{background:var(--panel);border:1px solid var(--rule);border-radius:8px;overflow:hidden;margin-top:12px}
.board-head,.board-row{display:grid;grid-template-columns:44px minmax(0,1fr) 54px 58px;align-items:center}
.board-head{background:var(--steel);padding:7px 0;font-family:var(--narrow);font-weight:700;font-size:12px;letter-spacing:.1em;color:var(--navy-ink)}
.board-head span:not(:nth-child(2)){text-align:center}
.board-row{color:inherit;font:inherit;cursor:pointer;min-height:58px;border:0;border-top:1px solid var(--rule);background:none;width:100%;text-align:left;padding:0}
.pos{font-family:var(--narrow);font-weight:700;font-size:22px;text-align:center;color:var(--navy-ink)}
.board-row.first .pos{color:var(--red-ink)}
.board-row .ev{text-align:center;font-family:var(--narrow);font-weight:600;font-size:17px;color:var(--muted)}
.board-row .pts{text-align:center;font-family:var(--narrow);font-weight:700;font-size:24px;color:var(--navy-ink)}
.board-detail{padding:4px 14px 14px 44px;border-top:1px solid var(--rule);font-size:14px}
.board-detail table{width:100%;border-collapse:collapse}
.board-detail td{padding:4px 0;border-bottom:1px dashed var(--rule)}
.board-detail td:last-child{text-align:right;font-family:var(--narrow);font-size:17px;font-weight:700}
.dropped td{color:var(--muted);text-decoration:line-through}

.badge{display:inline-block;font-family:var(--narrow);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:var(--steel);color:var(--navy-ink);vertical-align:middle}
.badge.major,.badge.live{background:var(--red);color:#fff}
.badge.final{background:var(--navy);color:#fff}

.btn{border:2px solid var(--navy);background:var(--navy);color:#fff;border-radius:6px;min-height:44px;padding:8px 16px;font-weight:700;white-space:nowrap}
.btn.red{border-color:var(--red);background:var(--red)}
.btn.ghost{background:none;color:var(--navy-ink);border-color:var(--navy-ink)}
.btn.danger{background:none;border-color:var(--red-ink);color:var(--red-ink)}
.btn.big{width:100%;padding:13px;font-size:17px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* Schedule */
.event{background:var(--panel);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.event .head{display:flex}
.event .date{width:62px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 0;background:var(--steel);color:var(--navy-ink)}
.event.major .date{background:var(--red);color:#fff}
.event.final .date{background:var(--navy);color:#fff}
.event .date .m{font-family:var(--narrow);font-weight:700;font-size:13px;letter-spacing:.08em}
.event .date .d{font-family:var(--narrow);font-weight:700;font-size:24px;line-height:1}
.event .info{flex:1;padding:10px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.event .tail{padding:0 14px 12px}
.finale{border:2px solid var(--navy-ink);border-radius:8px;overflow:hidden;background:var(--panel)}
.finale .strip{background:var(--navy);color:#fff;padding:7px 14px}
.finale .body{padding:12px 14px}

label.field{display:block;margin-bottom:12px}
label.field>span{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=number],input[type=date],select{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--bg)}
input.tiny{width:64px;padding:8px;text-align:center}
.check{display:flex;gap:10px;align-items:center;padding:6px 0}
.check input{width:20px;height:20px}
.pcard{border:1px solid var(--rule);border-radius:8px;padding:10px;margin-bottom:10px}
.pcard .row{flex-wrap:nowrap}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.grid{border-collapse:collapse;font-size:14px;min-width:100%}
table.grid th,table.grid td{border:1px solid var(--rule);padding:6px 5px;text-align:center}
table.grid th{font-family:var(--narrow);font-weight:700;font-size:14px;background:var(--navy);color:#fff;border-color:var(--navy)}
table.grid tr.par td{background:var(--steel);font-weight:600}
table.grid td.name{text-align:left;white-space:nowrap;font-weight:700}
table.grid td.tot{font-family:var(--narrow);font-weight:700;font-size:16px}
/* Tour style marks: circle for 3+ points, box for 1, double box for 0 */
.mk{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;font-weight:700}
.mk.c{border:1.5px solid var(--red-ink);border-radius:50%;color:var(--red-ink)}
.mk.s{border:1.5px solid var(--navy-ink)}
.mk.d{border:1.5px solid var(--navy-ink);outline:1.5px solid var(--navy-ink);outline-offset:2px;width:20px;height:20px}

/* Scorecard */
.holes{display:flex;gap:5px;padding:4px 0 8px}
.holes button{flex:0 0 36px;height:40px;border-radius:4px;border:1px solid var(--rule);background:var(--panel);font-family:var(--narrow);font-weight:700;font-size:17px}
.holes button.done{background:var(--navy);border-color:var(--navy);color:#fff}
.holes button.cur{background:var(--red);border-color:var(--red);color:#fff}
.hole-head{display:flex;align-items:flex-end;justify-content:space-between;margin:10px 0;padding-bottom:8px;border-bottom:2px solid var(--navy-ink)}
.hole-head .no{font-weight:900;font-style:italic;font-size:40px;line-height:1;color:var(--navy-ink);text-transform:uppercase}
.hole-head .meta{font-family:var(--narrow);font-size:22px;font-weight:700;text-align:right;line-height:1.1}
.player{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center}
.player .who strong{font-size:16px;white-space:normal;line-height:1.15}
.player .dots{color:var(--red-ink);letter-spacing:2px;font-size:13px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:46px;height:46px;border-radius:6px;border:1px solid var(--rule);background:var(--bg);font-size:24px;font-weight:700;line-height:1;color:var(--navy-ink)}
.stepper .val{min-width:44px;text-align:center;font-family:var(--narrow);font-weight:700;font-size:34px;color:var(--navy-ink)}
.player .foot{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.hp{font-family:var(--narrow);font-weight:700;font-size:16px;color:var(--navy-ink);background:var(--steel);border-radius:4px;padding:1px 7px}
.hp.good{background:var(--red);color:#fff}
.hp.zero{background:var(--red-soft);color:var(--red-ink)}
.pick{border:1px dashed var(--rule);background:none;border-radius:6px;min-height:36px;padding:4px 10px;font-size:13px}
.pick.on{border-style:solid;border-color:var(--red-ink);color:var(--red-ink)}
.navrow{display:flex;gap:10px;margin-top:14px}
.navrow .btn{flex:1}

.result{width:100%;border-collapse:collapse;font-size:14px}
.result th{background:var(--steel);font-family:var(--narrow);font-weight:700;font-size:11px;letter-spacing:.1em;color:var(--navy-ink);padding:6px 0;text-align:left}
.result td{padding:6px 0;border-top:1px solid var(--rule)}
.result .n{text-align:right;font-family:var(--narrow);font-size:16px;font-weight:700;width:64px}
.result th.n{font-size:11px}
.result .p{width:34px;text-align:center;font-family:var(--narrow);font-weight:700;font-size:16px}
.result th.p{font-size:11px}

/* Tour Champion */
.champ{margin:0 -16px;background:var(--navy);color:#fff;overflow:hidden}
.champ-hero{position:relative;height:270px;display:flex;align-items:flex-end;justify-content:center}
.champ-year{position:absolute;top:6px;left:0;right:0;text-align:center;font-weight:900;font-style:italic;font-size:150px;line-height:1;color:transparent;-webkit-text-stroke:1.5px var(--navy-line)}
.champ-hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:64px;background:var(--red)}
.champ-hero .av{position:relative;z-index:1;border-radius:12px 12px 0 0;border:4px solid #fff;border-bottom:0;background:#C9D3E3;color:#8394B3}
.champ-band{background:var(--red);padding:12px 20px 18px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.champ-band h2{margin:0;font-weight:900;font-style:italic;font-size:38px;line-height:1}
.champ-country{display:flex;align-items:center;gap:7px;font-weight:600}
.champ-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#fff;color:#0A1F44}
.champ-stats>div{padding:12px 0;display:flex;flex-direction:column;align-items:center;border-right:1px solid #D5DBE5}
.champ-stats>div:last-child{border-right:0}
.champ-stats .num{font-size:28px;line-height:1}
.champ-stats span:last-child{font-size:11px;font-weight:700;letter-spacing:.08em;color:#56627A}
.champ-rest{padding:16px 16px 20px}
.champ-rest .eyebrow{color:var(--sub-navy);margin-bottom:6px}
.champ-row{display:grid;grid-template-columns:30px minmax(0,1fr) 60px;align-items:center;min-height:52px;border-bottom:1px solid var(--navy-line)}
.champ-row .p{font-family:var(--narrow);font-weight:700;font-size:20px;color:var(--sub-navy)}
.champ-row .n{text-align:right;font-family:var(--narrow);font-weight:700;font-size:20px}
.champ-rest p{margin:12px 0 0;font-size:13px;color:var(--sub-navy)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:20;max-width:90%;font-size:15px}
.empty{text-align:center;padding:30px 10px}
@media (prefers-reduced-motion: no-preference){ .toast{animation:up .2s ease-out} @keyframes up{from{opacity:0;transform:translate(-50%,8px)}} }
</style>
</head>

<script type="module">

const FIREBASE_CONFIG = {

  messagingSenderId: "173832523185",

};
/* ================================================= */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, collection, onSnapshot, setDoc, updateDoc, deleteDoc, serverTimestamp, getDocFromServer }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signInAnonymously, signInWithPopup, signInWithRedirect, GoogleAuthProvider, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
/* ---------- constants ---------- */
// The keys are stored on rounds, so only the labels change with the theme
const TYPES = { standard:{label:"Tour Event", mult:1}, major:{label:"Away Day Major", mult:2}, final:{label:"Tour Championship", mult:2} };
const POINTS3 = [5,3,1];
const COUNTRIES = { ENG:"England", SCO:"Scotland", WAL:"Wales", IRL:"Ireland", GBR:"Great Britain" };

/* ---------- state ---------- */
const S = {
  db:null, user:null, ready:false, noDb:false,
  isOwner:false, canWrite:true,
  settings:null, courses:{}, rounds:{}, cards:{},
  tab:"table", openPlayer:null,
  cardRound:null, hole:1, fullCard:false,
  draftLeague:null, editCourse:null, editRound:null,
  local:{}, phase:"loading", unsubs:[], fs:null, auth:null, uid:null, pinBusy:false,
  theme:(()=>{ try { const t=localStorage.getItem("theme"); return t==="light"||t==="dark" ? t : "auto"; } catch(_) { return "auto"; } })()
};

/* ---------- tiny DOM helper (textContent only) ---------- */
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  if (props) for (const [k,v] of Object.entries(props)){
    if (v==null || v===false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k==="class") el.className = v;
    else if (k==="value") el.value = v;
    else if (k==="checked") el.checked = !!v;
    else if (k==="selected") el.selected = !!v;
    else if (v===true) el.setAttribute(k,"");
    else el.setAttribute(k, v);
  }
  for (const k of kids.flat(Infinity)){
    if (k==null || k===false) continue;
    el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  }
  return el;
}
// Same idea for SVG, which needs its own namespace. Attributes only, no markup strings
function s(tag, attrs, ...kids){
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k,v] of Object.entries(attrs||{})) el.setAttribute(k, v);
  el.append(...kids.flat());
  return el;
}
function toast(msg){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t = h("div",{class:"toast",role:"status"},msg);
  document.body.append(t); setTimeout(()=>t.remove(), 2800);
}
const uid = p => p + Math.random().toString(36).slice(2,9);
const today = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const fmtDate = s => { if(!s) return ""; const d=new Date(s+"T12:00:00"); return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}); };
const fmtIndex = n => n==null||isNaN(n) ? "" : (n<0 ? "+"+Math.abs(n) : String(n));
const parseIndex = s => { s=String(s).trim(); if(!s) return NaN; return s.startsWith("+") ? -parseFloat(s.slice(1)) : parseFloat(s); };
const fmtPts = n => Number.isInteger(n) ? String(n) : n.toFixed(1);

/* ---------- golf maths ---------- */
function courseHandicap(index, tee, course){
  const par = course.par.reduce((a,b)=>a+b,0);
  return Math.round(index * tee.slope / 113 + (tee.cr - par));
}
function playingHandicap(ch, allowance, adj){ return Math.round(ch * allowance / 100) + (adj||0); }
function shotsOn(ph, si){
  if (ph >= 0) return Math.floor(ph/18) + (si <= ph%18 ? 1 : 0);
  const g = -ph; return -(Math.floor(g/18) + (si > 18 - (g%18) ? 1 : 0));
}
function holePoints(strokes, par, shots){
  if (strokes==null || strokes==="P") return 0;
  return Math.max(0, par + shots - strokes + 2);
}
const playerById = id => (S.settings?.players||[]).find(p=>p.id===id);
const pname = id => playerById(id)?.name || "Former player";
const cardId = (rid,pid) => rid + "__" + pid;
// A card stores each hole as its own field (h1..h18) so phones never overwrite each other's holes
function strokesFor(rid,pid){
  const id = cardId(rid,pid), c = S.cards[id] || {}, loc = S.local[id] || {};
  return Array.from({length:18}, (_,i)=>{ const k="h"+(i+1); return (k in loc ? loc[k] : c[k]) ?? null; });
}
function cardFor(rid,pid){ return S.cards[cardId(rid,pid)]; }
function stableford(round, pid){
  const course = S.courses[round.courseId]; if(!course) return 0;
  const ph = round.hcp?.[pid]?.ph ?? 0; const st = strokesFor(round.id,pid);
  let t=0; for(let i=0;i<18;i++) t += holePoints(st[i], course.par[i], shotsOn(ph, course.si[i]));
  return t;
}
function thru(round,pid){ return strokesFor(round.id,pid).filter(x=>x!=null).length; }
function roundStatus(r){
  const cs = r.players.map(p=>cardFor(r.id,p));
  if (r.players.length && cs.every(c=>c?.submitted)) return "complete";
  if (r.players.some(p=>thru(r,p)>0)) return "live";
  return "scheduled";
}
function roundResults(r){
  const rows = r.players.map(pid=>({pid, score:stableford(r,pid)})).sort((a,b)=>b.score-a.score);
  const table = POINTS3;
  const mult = TYPES[r.type]?.mult || 1;
  let i=0;
  while (i<rows.length){
    let j=i; while (j+1<rows.length && rows[j+1].score===rows[i].score) j++;
    let sum=0; for(let k=i;k<=j;k++) sum += table[k]||0;
    for(let k=i;k<=j;k++){ rows[k].pos=i+1; rows[k].pts = (sum/(j-i+1))*mult; }
    i=j+1;
  }
  return rows;
}
const seasonRounds = () => Object.values(S.rounds).filter(r=>r.season===S.settings?.season);
function leaderboard(){
  const players = S.settings?.players||[]; const bestOf = +S.settings?.bestOf || 0;
  const done = seasonRounds().filter(r=>roundStatus(r)==="complete").sort((a,b)=>a.date<b.date?-1:1);
  const byP = {}; players.forEach(p=>byP[p.id]={pid:p.id, entries:[], total:0, wins:0, best:null});
  for (const r of done){
    for (const row of roundResults(r)){
      const b = byP[row.pid]; if(!b) continue;
      b.entries.push({r, pts:row.pts, score:row.score, pos:row.pos, n:r.players.length});
      if (row.pos===1) b.wins++;
      if (b.best==null || row.score>b.best) b.best=row.score;
    }
  }
  for (const b of Object.values(byP)){
    const ranked = [...b.entries].sort((a,c)=>c.pts-a.pts || (a.r.date<c.r.date?-1:1));
    const counted = new Set((bestOf>0 ? ranked.slice(0,bestOf) : ranked).map(e=>e.r.id));
    b.entries.forEach(e=>e.counted=counted.has(e.r.id));
    b.total = b.entries.filter(e=>e.counted).reduce((a,e)=>a+e.pts,0);
  }
  return Object.values(byP).sort((a,b)=>b.total-a.total || b.wins-a.wins || (b.best??-1)-(a.best??-1));
}
// Table positions: players level on points share a position. Strict also needs wins and best round level,
// which is how the champion is decided
function withPositions(lb, strict){
  let prev=null, prevPos=0;
  return lb.map((b,i)=>{
    const level = prev && prev.total===b.total && (!strict || (prev.wins===b.wins && prev.best===b.best));
    const pos = level ? prevPos : i+1; prev=b; prevPos=pos; return {...b, pos};
  });
}
// The season closes when its Tour Championship has been played and submitted
const seasonFinal = () => seasonRounds().filter(r=>r.type==="final" && roundStatus(r)==="complete").sort((a,b)=>a.date<b.date?1:-1)[0];
function suggestedAdj(forType, date, excludeId){
  if (!S.settings?.adjust || forType!=="standard") return {};
  const prev = seasonRounds().filter(r=>r.id!==excludeId && r.date<=date && r.players.length>=3 && roundStatus(r)==="complete")
    .sort((a,b)=>a.date<b.date?1:-1)[0];
  if (!prev) return {};
  const res = roundResults(prev), out={};
  if (res[0].score !== res[1]?.score) out[res[0].pid] = -1;
  const last = res[res.length-1]; if (last.score !== res[res.length-2]?.score) out[last.pid] = 1;
  return out;
}

/* ---------- writes ---------- */
async function guarded(fn, okMsg){
  try { await fn(); if(okMsg) toast(okMsg); return true; }
  catch(e){
    if (e?.code==="permission-denied") toast("You don't have permission to change this");
    else toast("Couldn't save ("+(e?.code||"error")+"). Try again");
    return false;
  }
}
function setStroke(rid,pid,hole,val){
  const id = cardId(rid,pid), k = "h"+hole;
  (S.local[id] ||= {})[k] = val;
  // Merge write of ONE hole. Not awaited: Firestore applies it locally at once and syncs when there's signal
  S.db.doc("cards/"+id).setMerge({roundId:rid, playerId:pid, [k]:val}).catch(e=>{
    if (S.local[id]) delete S.local[id][k];
    toast(e?.code==="permission-denied" ? "That card is locked. Ask the organiser to reopen the round" : "Couldn't save that score");
    render();
  });
  render();
}
function submitRound(r){
  const bad = r.players.filter(p=>thru(r,p)<18);
  if (bad.length){ toast("Every hole needs a score or a pick up first"); return; }
  // Submitting sends the card exactly as this phone shows it, so check the full card first
  const writes = r.players.map(p=>{
    const d = {roundId:r.id, playerId:p, submitted:true};
    strokesFor(r.id,p).forEach((v,i)=>d["h"+(i+1)]=v);
    return S.db.doc("cards/"+cardId(r.id,p)).setMerge(d);
  });
  Promise.all(writes).catch(e=>toast(e?.code==="permission-denied" ? "Submit was refused. Check the round with the organiser" : "Submit failed. Try again"));
  toast(navigator.onLine ? "Scores submitted. The table is updated" : "Submitted. It'll sync when you've got signal");
  S.tab="table"; render();
}
async function reopenRound(r){
  if (!confirm("Reopen this round so scores can be changed?")) return;
  await guarded(async()=>{ for(const p of r.players){ if(cardFor(r.id,p)) await S.db.doc("cards/"+cardId(r.id,p)).update({submitted:false}); } }, "Round reopened");
}
async function deleteRound(r){
  if (!confirm("Delete this round and any scores in it?")) return;
  await guarded(async()=>{
    for(const p of r.players){ if(cardFor(r.id,p)) await S.db.doc("cards/"+cardId(r.id,p)).delete(); }
    await S.db.doc("admin/cfg/rounds/"+r.id).delete();
  }, "Round deleted");
}
async function setLeaguePin(pin){
  pin = pin.trim();
  if (pin.length < 6) return toast("Use at least 6 characters. Longer is harder to guess");
  if (await guarded(()=>S.db.doc("secret/pin").set({value:pin}), "League PIN saved. Send it to your mates")) render();
}

async function saveCourse(){
  const c = S.editCourse;
  if (!c.name.trim()) return toast("Give the course a name");
  if (c.par.some(p=>!(p>=3&&p<=6))) return toast("Each par should be between 3 and 6");

  if (si.some(x=>!(x>=1&&x<=18)) || set.size!==18) return toast("Stroke indexes must use each number from 1 to 18 once");
  const tees = [];
  for (const t of c.tees){
    const cr=parseFloat(t.cr), sl=parseInt(t.slope,10);
    if (!t.name.trim() || isNaN(cr) || !(sl>=55&&sl<=155)) return toast("Each tee needs a name, a rating like 70.4 and a slope between 55 and 155");
    tees.push({id:t.id, name:t.name.trim(), cr, slope:sl});
  }
  const clean = {id:c.id, name:c.name.trim(), par:c.par.map(Number), si, tees};
  if (await guarded(()=>S.db.doc("admin/cfg/courses/"+c.id).set(clean), "Course saved")){ S.editCourse=null; render(); }

  return [h("div",{class:"panel", style:"margin-top:24px"},
    h("h2",{style:"margin-top:0"},"Enter the league PIN"),
    h("p",{class:"muted"},"You only need to do this once on this phone."),
    h("input",{type:"text", autocomplete:"off", autocapitalize:"off", "aria-label":"League PIN", placeholder:"PIN",
      oninput:e=>v=e.target.value, onkeydown:e=>{ if(e.key==="Enter") go(); }}),
    h("button",{class:"btn big", style:"margin-top:12px", disabled:S.pinBusy, onclick:go}, S.pinBusy?"Checking…":"Join the league")),
    h("p",{style:"margin-top:18px;text-align:center"}, h("button",{class:"btn ghost", onclick:organiserSignIn},"Organiser sign in"))];
}
async function organiserSignIn(){
  const p = new GoogleAuthProvider();
  try { await signInWithPopup(S.auth, p); }
  catch(e){ if (e?.code==="auth/popup-blocked" || e?.code==="auth/operation-not-supported-in-this-environment") signInWithRedirect(S.auth, p); else if (e?.code!=="auth/popup-closed-by-user") toast("Sign in failed ("+e.code+")"); }
}
function viewNotAdmin(){
  return [h("div",{class:"panel", style:"margin-top:24px"},
    h("h2",{style:"margin-top:0"},"This Google account isn't the organiser"),
    h("p",null,"If you're setting the league up, this is your UID. Paste it into firestore.rules, publish the rules in the Firebase console, then reload this page."),
    h("input",{type:"text", readonly:true, value:S.uid, "aria-label":"Your UID", onfocus:e=>e.target.select()}),
    h("button",{class:"btn ghost", style:"margin-top:12px", onclick:()=>signOut(S.auth)},"Sign out"))];
}

function render(){
  const app = document.getElementById("app");
  const header = h("header",{class:"top"}, h("div",{class:"inner"},
    h("h1",{class:"brand", style:"margin:0"}, logo(), "TINPOT TOUR"),
    h("div",{class:"hdr-right"}, S.settings?.season ? h("div",{class:"season"}, S.settings.season) : null, themeButton())));
  const main = h("main",{class:"wrap"});
  const bare = (...kids)=>{ main.append(...kids); app.replaceChildren(header, main); };
  if (S.phase==="config") return bare(h("div",{class:"panel", style:"margin-top:24px"}, h("h2",{style:"margin-top:0"},"Almost there"), h("p",null,"Paste your Firebase config into FIREBASE_CONFIG at the top of index.html.")));
  if (S.phase==="pin") return bare(...viewPin());
  if (S.phase==="notadmin") return bare(...viewNotAdmin());
  if (!S.ready) return bare(h("p",{class:"muted", style:"margin-top:24px"},"Loading the league…"));

  const closed = !!seasonFinal();
  if (S.tab==="champion" && !closed) S.tab="table";
  if (!S.settings && !S.isOwner){
    main.append(h("div",{class:"panel empty", style:"margin-top:24px"},"The league hasn't been set up yet."));
  } else if (!S.settings && S.isOwner && S.tab!=="setup"){
    main.append(h("div",{class:"panel", style:"margin-top:24px"}, h("h2",{style:"margin-top:0"},"Set up your league"),
      h("p",null,"Set a league PIN, add your players and handicaps, then a course, then your first event."),
      h("button",{class:"btn", onclick:()=>{S.tab="setup"; render();}},"Start setup")));
  } else {
    const v = {table:viewTable, champion:viewChampion, rounds:viewRounds, card:viewCard, setup:viewSetup}[S.tab]();
    main.append(...v);
    if (S.tab==="setup" && !S.editCourse && !S.editRound) main.append(...pinSection());
  }
  const tabs = [["table","Standings"]];
  if (closed) tabs.push(["champion","Champion"]);
  tabs.push(["rounds","Schedule"],["card","Scorecard"]);
  if (S.isOwner) tabs.push(["setup","Setup"]);
  const nav = h("nav",{class:"tabs", "aria-label":"Sections"}, h("div",{class:"inner"},
    tabs.map(([k,l])=>h("button",{"aria-current":S.tab===k?"page":null, onclick:()=>{
      if (k==="card" && S.tab!=="card"){ S.cardRound = S.cardRound && S.rounds[S.cardRound] && roundStatus(S.rounds[S.cardRound])!=="complete" ? S.cardRound : null; S.fullCard=false; }
      if (k!=="setup"){ S.editCourse=null; S.editRound=null; }
      S.tab=k; render(); window.scrollTo(0,0); }}, l))));
  app.replaceChildren(header, main, nav);
}
function snapRender(){
  const a = document.activeElement;
  if (a && /^(INPUT|SELECT)$/.test(a.tagName)){ S.pendingRender=true; return; }
  render();
}
document.addEventListener("focusout", ()=>setTimeout(()=>{
  const a=document.activeElement;
  if (S.pendingRender && !(a && /^(INPUT|SELECT)$/.test(a.tagName))){ S.pendingRender=false; render(); }
},50));

function teardown(){ (S.unsubs||[]).forEach(u=>u()); S.unsubs=[]; S.ready=false; }
function subscribe(){
  teardown(); S.phase="ready"; render();
  let loaded=0; const mark=()=>{ if(++loaded>=4 && !S.ready){ S.ready=true; render(); } };
  const onErr = e=>{
    if (e?.code==="permission-denied"){ teardown(); S.phase = S.isOwner ? "ready" : "pin"; render(); if(!S.isOwner) toast("Enter the league PIN to continue"); }
    else toast("Lost connection to the league. Reload to reconnect");
  };
  const fs=S.fs;
  S.unsubs.push(onSnapshot(doc(fs,"admin/cfg"), s=>{ S.settings = s.exists() ? s.data() : null; mark(); snapRender(); }, onErr));
  S.unsubs.push(onSnapshot(collection(fs,"admin/cfg/courses"), q=>{ const o={}; q.docs.forEach(d=>o[d.id]={...d.data(), id:d.id}); S.courses=o; mark(); snapRender(); }, onErr));
  S.unsubs.push(onSnapshot(collection(fs,"admin/cfg/rounds"), q=>{ const o={}; q.docs.forEach(d=>o[d.id]={...d.data(), id:d.id}); S.rounds=o; mark(); snapRender(); }, onErr));
  S.unsubs.push(onSnapshot(collection(fs,"cards"), q=>{
    const o={}; q.docs.forEach(d=>o[d.id]=d.data()); S.cards=o;
    for (const id of Object.keys(S.local)){
      for (const k of Object.keys(S.local[id])) if ((o[id]?.[k] ?? null) === S.local[id][k]) delete S.local[id][k];
      if (!Object.keys(S.local[id]).length) delete S.local[id];
    }
    mark(); snapRender();
  }, onErr));
}

function boot(){
  if (!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.startsWith("PASTE")){ S.phase="config"; render(); return; }
  const app = initializeApp(FIREBASE_CONFIG);
  S.fs = initializeFirestore(app, {localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()})});
  S.auth = getAuth(app);
  const fs = S.fs;
  S.db = { doc: p => ({ set: d=>setDoc(doc(fs,p),d), setMerge: d=>setDoc(doc(fs,p),d,{merge:true}), update: d=>updateDoc(doc(fs,p),d), delete: ()=>deleteDoc(doc(fs,p)) }) };
  render();
  onAuthStateChanged(S.auth, async u=>{
    teardown();
    if (!u){ signInAnonymously(S.auth).catch(e=>toast("Couldn't connect ("+e.code+")")); return; }
    S.uid = u.uid; S.isOwner = false;
    if (!u.isAnonymous){
      // Organiser check happens on Google's side: only the UID in the rules can read this
      try { await getDocFromServer(doc(S.fs,"adminCheck/me")); S.isOwner = true; }
      catch(e){
        if (e?.code!=="permission-denied") toast("Couldn't check organiser access. Check your connection and reload");
        S.phase="notadmin"; render(); return;
      }
    }
    if (!S.isOwner && S.tab==="setup") S.tab="table";
    subscribe();
  });
}
boot();
</script>
</body>
</html>
